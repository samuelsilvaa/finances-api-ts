services:
  db:
    image: postgres:18-alpine
    container_name: db_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ACCESS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ACCESS_PASSWORD}
      POSTGRES_DB: ${POSTGRES_ACCESS_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: